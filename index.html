<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeMOCKracy - The Game</title>
  <meta name="description" content="A satirical runner game.">
  <meta name="theme-color" content="#f7f7f7">

  <!-- Open Graph -->
  <meta property="og:title" content="DeMOCKracy - The Game">
  <meta property="og:description" content="A satirical runner game.">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Silkscreen & Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper" id="game-wrapper">
    <header class="header">
      <h1 class="title">De<span class="mock">MOCK</span>racy</h1>
      <p class="tagline">A satirical runner game.</p>
    </header>

    <div class="canvas-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- Mobile-Only Large Touch Buttons -->
    <div class="mobile-touch-bar" id="mobile-touch-bar">
      <button class="touch-btn touch-btn-duck" id="touch-duck-btn">⬇ DUCK</button>
      <button class="touch-btn touch-btn-jump" id="touch-jump-btn">⬆ JUMP</button>
    </div>

    <!-- Desktop Controls Hint -->
    <div class="controls-bar" id="controls-bar">
      <div class="ctrl-tag desktop-only">
        <span class="key">SPACE</span> / <span class="key">↑</span> Jump &nbsp;·&nbsp; 
        <span class="key">↓</span> Duck &nbsp;·&nbsp; 
        <span class="key">←</span> <span class="key">→</span> Select &nbsp;·&nbsp; 
        <span class="key">C</span> Change Char &nbsp;·&nbsp; 
        <span class="key">M</span> Mute
      </div>
    </div>

    <!-- Share Area (Visible upon Game Over) -->
    <div class="share-area" id="share-area">
      <span class="share-title">SHARE YOUR SCORE</span>
      <div class="share-btns">
        <button class="share-btn" id="share-btn">Copy Score</button>
        <button class="share-btn share-x" id="share-x-btn">Post on X</button>
        <button class="share-btn share-wa" id="share-wa-btn">WhatsApp</button>
      </div>
    </div>

    <footer class="footer">
      <p>A satirical runner game.</p>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
